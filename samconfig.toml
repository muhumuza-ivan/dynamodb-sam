# Local / manual SAM CLI configuration. CI passes bucket, roles and region
# explicitly (see .github/workflows). Bucket names come from
# .aws-sam/pipeline/pipelineconfig.toml (written by `sam pipeline bootstrap`).
#
#   sam deploy --config-env dev  --s3-bucket <dev artifacts_bucket>
#   sam deploy --config-env prod --s3-bucket <prod artifacts_bucket>
version = 0.1

[default.global.parameters]
stack_name = "dynamodb-sam-dev"

[default.validate.parameters]
lint = true

[dev.deploy.parameters]
stack_name = "dynamodb-sam-dev"
s3_prefix = "dynamodb-sam-dev"
region = "eu-west-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "Environment=\"dev\""
tags = "Application=\"dynamodb-sam\" Environment=\"dev\""

[prod.deploy.parameters]
stack_name = "dynamodb-sam-prod"
s3_prefix = "dynamodb-sam-prod"
region = "eu-west-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "Environment=\"prod\""
tags = "Application=\"dynamodb-sam\" Environment=\"prod\""
