# Development pipeline - split from the workflow generated by `sam pipeline init`
# (original kept at docs/sam-generated-pipeline.yaml). Deploys ONLY the dev stack,
# using ONLY the dev resources (stack dynamodb-sam-pipeline-dev) created by the
# dynamodb-sam-bootstrap repo and registered in .aws-sam/pipeline/pipelineconfig.toml.
#
# The dev pipeline execution role trusts only
#   repo:muhumuza-ivan@211486075/dynamodb-sam@1398622736:ref:refs/heads/develop
# so this workflow must run from `develop` and must not use a GitHub
# `environment:` (that changes the OIDC subject claim).
name: Pipeline - Development

on:
  push:
    branches: [develop]
    paths:
      - template.yaml
      - .github/workflows/pipeline-dev.yml
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: pipeline-dev
  cancel-in-progress: false

env:
  SAM_CLI_TELEMETRY: 0
  SAM_TEMPLATE: template.yaml
  STAGE: dev
  DEV_STACK_NAME: dynamodb-sam-dev
  DEV_PIPELINE_EXECUTION_ROLE: arn:aws:iam::765812221756:role/dynamodb-sam-dev-pipeline-exec-role
  DEV_CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::765812221756:role/dynamodb-sam-dev-cfn-exec-role
  DEV_ARTIFACTS_BUCKET: dynamodb-sam-artifacts-dev-765812221756-eu-west-1
  DEV_REGION: eu-west-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate and lint template
        run: sam validate --lint --template ${SAM_TEMPLATE} --region ${DEV_REGION}

  build-and-package:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build resources
        run: sam build --template ${SAM_TEMPLATE}

      - name: Assume the dev pipeline user role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.DEV_REGION }}
          role-to-assume: ${{ env.DEV_PIPELINE_EXECUTION_ROLE }}
          role-session-name: dev-packaging
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Upload artifacts to dev artifact bucket
        run: |
          sam package \
            --s3-bucket ${DEV_ARTIFACTS_BUCKET} \
            --s3-prefix ${DEV_STACK_NAME} \
            --region ${DEV_REGION} \
            --output-template-file packaged-dev.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: packaged-dev.yaml
          path: packaged-dev.yaml

  deploy-dev:
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: actions/download-artifact@v4
        with:
          name: packaged-dev.yaml

      - name: Assume the dev pipeline user role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.DEV_REGION }}
          role-to-assume: ${{ env.DEV_PIPELINE_EXECUTION_ROLE }}
          role-session-name: dev-deployment
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Deploy to dev
        run: |
          sam deploy --stack-name ${DEV_STACK_NAME} \
            --template packaged-dev.yaml \
            --capabilities CAPABILITY_IAM \
            --region ${DEV_REGION} \
            --s3-bucket ${DEV_ARTIFACTS_BUCKET} \
            --s3-prefix ${DEV_STACK_NAME} \
            --parameter-overrides Environment=${STAGE} \
            --tags Application=dynamodb-sam Environment=${STAGE} \
            --no-fail-on-empty-changeset \
            --role-arn ${DEV_CLOUDFORMATION_EXECUTION_ROLE}

      - name: Stack outputs
        run: |
          aws cloudformation describe-stacks --stack-name ${DEV_STACK_NAME} \
            --query "Stacks[0].Outputs[].[OutputKey,OutputValue]" --output table
