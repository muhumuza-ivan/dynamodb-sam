# Production pipeline - split from the workflow generated by `sam pipeline init`
# (original kept at docs/sam-generated-pipeline.yaml). Deploys ONLY the prod stack,
# using ONLY the prod resources (stack dynamodb-sam-pipeline-prod) created by the
# dynamodb-sam-bootstrap repo and registered in .aws-sam/pipeline/pipelineconfig.toml.
#
# The prod pipeline execution role trusts only
#   repo:muhumuza-ivan@211486075/dynamodb-sam@1398622736:ref:refs/heads/main
# so this workflow must run from `main` and must not use a GitHub
# `environment:` (that changes the OIDC subject claim).
name: Pipeline - Production

on:
  push:
    branches: [main]
    paths:
      - template.yaml
      - .github/workflows/pipeline-prod.yml
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: pipeline-prod
  cancel-in-progress: false

env:
  SAM_CLI_TELEMETRY: 0
  SAM_TEMPLATE: template.yaml
  STAGE: prod
  PROD_STACK_NAME: dynamodb-sam-prod
  PROD_PIPELINE_EXECUTION_ROLE: arn:aws:iam::765812221756:role/dynamodb-sam-prod-pipeline-exec-role
  PROD_CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::765812221756:role/dynamodb-sam-prod-cfn-exec-role
  PROD_ARTIFACTS_BUCKET: dynamodb-sam-artifacts-prod-765812221756-eu-west-1
  PROD_REGION: eu-west-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate and lint template
        run: sam validate --lint --template ${SAM_TEMPLATE} --region ${PROD_REGION}

  build-and-package:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build resources
        run: sam build --template ${SAM_TEMPLATE}

      - name: Assume the prod pipeline user role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.PROD_REGION }}
          role-to-assume: ${{ env.PROD_PIPELINE_EXECUTION_ROLE }}
          role-session-name: prod-packaging
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Upload artifacts to prod artifact bucket
        run: |
          sam package \
            --s3-bucket ${PROD_ARTIFACTS_BUCKET} \
            --s3-prefix ${PROD_STACK_NAME} \
            --region ${PROD_REGION} \
            --output-template-file packaged-prod.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: packaged-prod.yaml
          path: packaged-prod.yaml

  deploy-prod:
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: actions/download-artifact@v4
        with:
          name: packaged-prod.yaml

      - name: Assume the prod pipeline user role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.PROD_REGION }}
          role-to-assume: ${{ env.PROD_PIPELINE_EXECUTION_ROLE }}
          role-session-name: prod-deployment
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Deploy to production
        run: |
          sam deploy --stack-name ${PROD_STACK_NAME} \
            --template packaged-prod.yaml \
            --capabilities CAPABILITY_IAM \
            --region ${PROD_REGION} \
            --s3-bucket ${PROD_ARTIFACTS_BUCKET} \
            --s3-prefix ${PROD_STACK_NAME} \
            --parameter-overrides Environment=${STAGE} \
            --tags Application=dynamodb-sam Environment=${STAGE} \
            --no-fail-on-empty-changeset \
            --role-arn ${PROD_CLOUDFORMATION_EXECUTION_ROLE}

      - name: Stack outputs
        run: |
          aws cloudformation describe-stacks --stack-name ${PROD_STACK_NAME} \
            --query "Stacks[0].Outputs[].[OutputKey,OutputValue]" --output table
